<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHECKPOINT LOGIN</title>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg vapor-nav" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="img/logo.png" alt="Logo Checkpoint" height="64" width="64">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Navegación móvil">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page">CHECKPOINT LOGIN</a>
                    </li>
                    <li class="nav-item"></li>
                    <a class="nav-link" aria-current="page" href="index.html">Menú Principal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="productos.html">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="nosotros.html">Nosotros</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="blogs.html">Blogs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contactos.html">Contactos</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="login-wrapper">
        <div class="contenedor">
            <h1 class="titulo-login titulo-fondo-negro">BUFFED UP!</h1>

            <form id="loginForm" class="formulario" novalidate>
                <div class="mb-3">
                    <h3  class="titulo-fondo-negro">Correo</h3>
                    <input type="email" class="form-control" id="correoInput" maxlength="100"
                        placeholder="ejemplo@duoc.cl" required>
                    <div id="emailHelp" class="form-text titulo-fondo-negro" style="color: aliceblue;">
                        Permitidos: @duoc.cl, @profesor.duoc.cl, @gmail.com
                    </div>
                </div>

                <div class="mb-3">
                    <h3  class="titulo-fondo-negro">Contraseña</h3>
                    <input type="password" class="form-control" id="passwordInput" minlength="4" maxlength="10"
                        placeholder="De 4 a 10 caracteres" required>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="recuerdameCheck">
                    <label class="form-check-label" for="recuerdameCheck">Recuérdame</label>
                </div>

                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="js/admin-usuarios.js"></script>
</body>

</html>
