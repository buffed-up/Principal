<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-white">
    <nav class="navbar navbar-expand-lg vapor-nav bg-dark" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="admin-mostrar-usuario.html">⬅ CANCELAR EDICIÓN</a>
        </div>
    </nav>

    <div class="container mt-5 p-4 d-flex justify-content-center"> 
        <div class="card vapor-card p-4 w-75 fondo-editar-producto" style="background-color: #2b2b2b;">
            <h2 class="text-center mb-4 titulo-fondo-negro">EDITAR USUARIO</h2>
            
            <form id="formEditarUsuario">
                <input type="hidden" id="editIdInput"> 
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <h3 class="titulo-fondo-negro">RUN</h3>
                        <input type="text" class="form-control" id="editRunInput" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <h3 class="titulo-fondo-negro">Rol</h3>
                        <select class="form-select" id="editRolInput" required>
                            <option value="administrador">Administrador</option>
                            <option value="cliente">Cliente</option>
                            <option value="vendedor">Vendedor</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <h3 class="titulo-fondo-negro">Nombre</h3>
                        <input type="text" class="form-control" id="editNombreInput" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <h3 class="titulo-fondo-negro">Apellido</h3>
                        <input type="text" class="form-control" id="editApellidoInput" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <h3 class="titulo-fondo-negro">Correo</h3>
                        <input type="email" class="form-control" id="editCorreoInput" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <h3 class="titulo-fondo-negro">Fecha Nacimiento</h3>
                        <input type="date" class="form-control" id="editFechaNacInput">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <h3 class="titulo-fondo-negro">Región</h3>
                        <select class="form-select" id="editRegionInput" required></select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <h3 class="titulo-fondo-negro">Comuna</h3>
                        <select class="form-select" id="editComunaInput" required disabled></select>
                    </div>
                </div>

                <div class="mb-3">
                    <h3 class="titulo-fondo-negro">Dirección</h3>
                    <input type="text" class="form-control" id="editDireccionInput" required>
                </div>

                <button type="submit" class="btn btn-warning w-100 mt-3">ACTUALIZAR USUARIO</button>
            </form>
        </div>
    </div>

    <script src="js/admin-usuarios.js"></script>
</body>
</html>
