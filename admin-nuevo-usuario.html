<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Usuario - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-white">
    <nav class="navbar navbar-expand-lg vapor-nav bg-dark" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="admin-mostrar-usuario.html">⬅ VOLVER A USUARIOS</a>
        </div>
    </nav>

    <div class="container mt-5 p-5 d-flex justify-content-center"> 
        <!-- La imagen de fondo se mantiene en la tarjeta -->
        <div class="card vapor-card p-4 w-75 fondo-editar-producto" style="background-color: #2b2b2b;">
            <h2 class="text-center mb-4">AGREGAR USUARIO</h2>
            
            <form id="formNuevoUsuario">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <h3 class="titulo-fondo-negro">RUN (Sin puntos ni guion)</h3>
                        <input type="text" class="form-control" id="runInput" required minlength="7" maxlength="9" placeholder="Ej: 19011022K">
                    </div>
                    <div class="col-md-6 mb-3">
                        <h3 class="titulo-fondo-negro">Nombres</h3>
                        <input type="text" class="form-control" id="nombreInput" required maxlength="50">
                    </div>
                    <div class="col-md-6 mb-3">
                        <h3 class="titulo-fondo-negro">Apellidos</h3>
                        <input type="text" class="form-control" id="apellidoInput" required maxlength="100">
                    </div>
                    <div class="col-md-6 mb-3">
                        <h3 class="titulo-fondo-negro">Correo</h3>
                        <input type="email" class="form-control" id="correoInput" required maxlength="100">
                    </div>
                    <div class="col-md-6 mb-3">
                        <h3 class="titulo-fondo-negro">Fecha Nacimiento</h3>
                        <input type="date" class="form-control" id="fechaNacInput">
                    </div>
                    <div class="col-md-6 mb-3">
                        <h3 class="titulo-fondo-negro">Rol de Usuario</h3>
                        <select class="form-select" id="rolInput" required>
                            <option value="administrador">Administrador</option>
                            <option value="vendedor">Vendedor</option>
                            <option value="cliente">Cliente</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <h3 class="titulo-fondo-negro">Región</h3>
                        <select class="form-select" id="regionInput" required>
                            <option value="" selected disabled>Seleccione una región...</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <h3 class="titulo-fondo-negro">Comuna</h3>
                        <select class="form-select" id="comunaInput" required disabled>
                            <option value="" selected disabled>Seleccione una comuna...</option>
                        </select>
                    </div>
                    <div class="col-12 mb-3">
                        <h3 class="titulo-fondo-negro">Dirección</h3>
                        <input type="text" class="form-control" id="direccionInput" required maxlength="300">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-warning w-100 mt-3">GUARDAR USUARIO</button>
            </form>
        </div>
    </div>

    <script src="js/admin-usuarios.js"></script>
</body>
</html>
